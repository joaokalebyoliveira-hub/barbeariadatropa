<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento - Barbearia</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fonte Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
  --bg-primary: #121214  ;
  --bg-card: #202024;
  --bg-input: #121214;
  --text-primary: #e1e1e6;
  --text-secondary: #a8a8b3;
  --accent-color: #d4a373; /* Cor Ambar / Dourado Barbearia */
  --accent-hover: #bc8a5f;
  --border-color: #323238;
  --radius: 8px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 480px;
}

/* Cabeçalho */
.barber-header {
  text-align: center;
  margin-bottom: 24px;
}

.logo-barbearia {
  height: 180px;
  width: auto;
  border-radius: 8px;
  object-fit: cover;
  vertical-align: middle;
}
.logo-icon {
  font-size: 2.5rem;
  margin-bottom: 8px;
}

.barber-header h1 {
  font-size: 1.6rem;
  color: var(--accent-color);
  font-weight: 700;
}

.barber-header p {
  color: var(--text-secondary);
  font-size: 0.9rem;
}

/* Stepper (Passos) */
.stepper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}

.step {
  display: flex;
  align-items: center;
  gap: 8px;
  opacity: 0.5;
}

.step.active {
  opacity: 1;
}

.step-number {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background-color: var(--border-color);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 0.85rem;
}

.step.active .step-number {
  background-color: var(--accent-color);
  color: #121214;
}

.step-label {
  font-size: 0.85rem;
  font-weight: 600;
}

.step-line {
  flex: 1;
  height: 2px;
  background-color: var(--border-color);
  margin: 0 12px;
}

/* Form Card */
.card-form {
  background-color: var(--bg-card);
  padding: 28px;
  border-radius: var(--radius);
  border: 1px solid var(--border-color);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

.card-form h2 {
  font-size: 1.2rem;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 10px;
}

.input-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 16px;
}

.input-group-row {
  display: grid;
  gap: 12px;
}

label {
  font-size: 0.85rem;
  margin-bottom: 6px;
  color: var(--text-secondary);
}

input {
  background-color: var(--bg-input);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  padding: 12px;
  border-radius: var(--radius);
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.2s;
}

input:focus {
  border-color: var(--accent-color);
}

/* Botão */
.btn-primary {
  width: 100%;
  padding: 14px;
  background-color: var(--accent-color);
  color: #121214;
  border: none;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  transition: background-color 0.2s, transform 0.1s;
  margin-top: 10px;
}

.btn-primary:hover {
  background-color: var(--accent-hover);
}

.btn-primary:active {
  transform: scale(0.99);
}
  </style>
</head>
<body>

  <main class="container"> <!-- Cabeçalho -->
    <header class="barber-header">
      <div class="logo-icon"><img src="../img/logo.png" alt="Logo da barbearia" class="logo-barbearia"></div>
    </header>

    <!-- Indicador de Progresso -->
    <div class="stepper">
      <div class="step active">
        <span class="step-number">1</span>
        <span class="step-label">Seus Dados</span>
      </div>
      <div class="step-line"></div>
      <div class="step">
        <span class="step-number">2</span>
        <span class="step-label">Serviço & Data</span>
      </div>
    </div>

    <!-- Formulário Etapa 1 -->
    <form id="form-cadastro" class="card-form">
      <h2>Identificação do Cliente</h2>
      
      <div class="input-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: João Silva" required>
      </div>

      <div class="input-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
      </div>

      <div class="input-group-row">
        <div class="input-group">
          <label for="dataNascimento">Data de Nascimento</label>
          <input type="date" id="dataNascimento" name="dataNascimento" required>
        </div>

        <div class="input-group">
          <label for="telefone">WhatsApp / Celular</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(88) 99999-9999" maxlength="15" required>
        </div>
      </div>

      <button type="submit" class="btn-primary">
        Avançar para Serviços ➔
      </button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
