<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Administrador - Barbearia</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
  --bg-primary: #121214;
  --bg-card: #202024;
  --text-primary: #e1e1e6;
  --text-secondary: #a8a8b3;
  --accent-color: #d4a373; /* Dourado / Âmbar */
  --success-color: #2a9d8f; /* Verde Confirmação */
  --danger-color: #e76f51; /* Vermelho Exclusão */
  --border-color: #323238;
  --radius: 8px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Poppins', sans-serif;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  padding: 30px 20px;
  min-height: 100vh;
}

.admin-container {
  max-width: 800px;
  margin: 0 auto;
}

.admin-header {
  text-align: center;
  margin-bottom: 30px;
}

.admin-header h1 {
  color: var(--accent-color);
  font-size: 1.8rem;
}

.admin-header p {
  color: var(--text-secondary);
  font-size: 0.9rem;
  margin-top: 4px;
}

.admin-sections {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.card-section {
  background-color: var(--bg-card);
  padding: 24px;
  border-radius: var(--radius);
  border: 1px solid var(--border-color);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
}

.card-section h2 {
  font-size: 1.1rem;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 10px;
  color: var(--accent-color);
}

.appointments-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Card Individual de Agendamento */
.appointment-card {
  background-color: #121214;
  border: 1px solid var(--border-color);
  padding: 16px;
  border-radius: var(--radius);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

@media(max-width: 600px) {
  .appointment-card {
    flex-direction: column;
    align-items: flex-start;
  }
}

.appointment-info p {
  font-size: 0.9rem;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.appointment-info span {
  color: var(--text-secondary);
}

.appointment-actions {
  display: flex;
  gap: 8px;
}

/* Botões do Admin */
button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.8rem;
  transition: opacity 0.2s;
}

button:hover {
  opacity: 0.85;
}

.btn-confirm {
  background-color: var(--success-color);
  color: white;
}

.btn-delete {
  background-color: var(--danger-color);
  color: white;
}

.empty-msg {
  color: var(--text-secondary);
  font-size: 0.85rem;
  font-style: italic;
  text-align: center;
  padding: 15px;
}
  </style>
</head>
<body>

  <div class="admin-container">
    <header class="admin-header">
      <h1>✂️ Painel Administrativo</h1>
      <p>Gerenciamento de Agendamentos e Histórico</p>
    </header>

    <div class="admin-sections">
      <!-- Seção de Pendentes / Cortes do Dia -->
      <section class="card-section">
        <h2>🔔 Agendamentos Pendentes (Aguardando Confirmação)</h2>
        <div id="lista-pendentes" class="appointments-list">
          <!-- Preenchido via JavaScript -->
        </div>
      </section>

      <!-- Seção de Histórico / Concluídos -->
      <section class="card-section">
        <h2>📜 Histórico de Cortes Confirmados</h2>
        <div id="lista-historico" class="appointments-list">
          <!-- Preenchido via JavaScript -->
        </div>
      </section>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
